<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 552" width="600" height="552" role="img" aria-label="Two notebook cells and their rendered output">
<rect width="600" height="552" rx="16" fill="#f8fafc"/>
<rect x="92" y="18" width="490" height="98" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<text x="84" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" text-anchor="end" fill="#2563eb">In [1]:</text>
<text x="104" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#1f2937" xml:space="preserve">import anyalgebra.easy as aa</text>
<text x="104" y="63" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#1f2937" xml:space="preserve">H = aa.quaternions()</text>
<text x="104" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#1f2937" xml:space="preserve">x = (1 + 2 * H.i) * (H.j + H.k) / 2</text>
<text x="104" y="105" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#1f2937" xml:space="preserve">x</text>
<text x="84" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" text-anchor="end" fill="#dc2626">Out[1]:</text>
<text x="104" y="150" font-family="Georgia, Cambria, 'Times New Roman', serif" font-size="21" font-style="italic" fill="#1f2937">−½ j + 3/2 k</text>
